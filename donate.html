<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="Javascript/validation.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <style>
      body{
         margin: 0;
    background-color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px;
      }
      
    </style>
   
      
<body>

  <div class="card" id="donationCard">
   
    <h2>Make a Donation</h2>
    
    <label>Email address</label>
    <input type="text" id="email" placeholder="john@example.com">
    <div class="error-msg" id="emailError">Please enter a valid email ❌</div>

    <label>Donation Amount (ZAR)</label>
    <div class="amount-wrap">
      <input type="number" id="amount" value="150">
      <span id="amountDisplay">R150</span>
    </div>

    <button class="donate-btn" onclick="validateDonate()">Donate Now</button>
  </div>

  <div class="modal" id="thankYouModal">

    <div class="check">✓</div>
    <h3>Thank you for<br>supporting CHOC!</h3>
    <p id="thankText">Your R150 can provide a care bag<br>Your donation helps us provide care packs to children and families fighting childhood cancer.</p>
    <button class="ok-btn" onclick="closeModal()">OK</button>
  </div>
</div>





   
    
        

        
    </div>
</body>
</head>
</html>
