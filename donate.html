  <div class="card" id="donationCard">

    <label>Email address</label>
    <input type="text" id="email" placeholder="john@example.com">
    <div class="error-msg" id="emailError">Please enter a valid email ❌</div>

    <label>Donation Amount (ZAR)</label>
    <div class="amount-wrap">
      <input type="number" id="amount" value="150">
      <span id="amountDisplay">R150</span>
    </div>

    <button class="donate-btn" onclick="validateDonate()">Donate Now</button>
  </div>

  <div class="modal" id="thankYouModal">

    <div class="check">✓</div>
